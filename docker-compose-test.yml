version: '3.7'

services:
  mysql:
    image: mysql:8.0
    container_name: yabam-mysql-test
    ports:
      - "3315:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: "local_mydb"
      MYSQL_CHARSET: "utf8mb4"
      MYSQL_COLLATION: "utf8mb4_unicode_ci"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: always

  redis:
    image: redis:7.2-alpine
    container_name: yabam-redis-test
    ports:
      - "6380:6379"
    restart: always

volumes:
  mysql-data:
